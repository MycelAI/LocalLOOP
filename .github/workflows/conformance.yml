name: Protocol Conformance

# Three-way gate: backend schema copies <-> protocol/ <-> apps/site mirror,
# plus the openapi.json route surface. Runs whenever any side changes.
on:
  push:
    branches: [main]
    paths: ['apps/backend/**', 'protocol/**', 'apps/site/public/projects/**', 'apps/site/scripts/aggregate-docs.sh', '.github/workflows/conformance.yml']
  pull_request:
    paths: ['apps/backend/**', 'protocol/**', 'apps/site/public/projects/**', 'apps/site/scripts/aggregate-docs.sh', '.github/workflows/conformance.yml']

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mirror is in sync with protocol/
        run: |
          bash apps/site/scripts/aggregate-docs.sh
          git diff --exit-code
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install backend dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/backend
        working-directory: apps/backend
      - name: Three-way conformance gate
        run: bun run check:conformance
        working-directory: apps/backend
