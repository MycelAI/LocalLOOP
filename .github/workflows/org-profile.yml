name: Org Profile Policy

on:
  push:
    branches: [main]
    paths: ['ops/org-profile/**', '.github/workflows/org-profile.yml']
  pull_request:
    paths: ['ops/org-profile/**', '.github/workflows/org-profile.yml']

defaults:
  run:
    working-directory: ops/org-profile

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run profile policy checks
        run: bash scripts/check-policy.sh
      - name: Verify security contact pointer
        run: bash scripts/check-security-pointer.sh
