version: 2
updates:
  # apps/backend and apps/site are managed by Bun (bun.lock); the npm ecosystem
  # cannot update bun.lock and aborts. protocol/ keeps package-lock.json.
  - package-ecosystem: "bun"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bun"
    directory: "/apps/site"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/protocol"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
