<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">localLOOP architecture</title>
  <desc id="d">Runtime: a browser reaches loop.urbnia.com through the host's shared Traefik, which routes to the site container's nginx. nginx serves the static Next.js export and proxies /api/* to the backend API container (Bun and Fastify on port 8088) over the shared Docker proxy network. The API uses PostgreSQL with PostGIS, Valkey, and SeaweedFS behind an nginx storage proxy. The former hostnames localloop.urbnia.com and loop-api.urbnia.com answer with 308 redirects at Traefik. Build time: protocol/ is canonical; its schemas are synced byte-identical into the backend and its artifacts are mirrored into the site, and a conformance check fails on any drift.</desc>
