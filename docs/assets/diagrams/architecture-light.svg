<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">localLOOP architecture</title>
  <desc id="d">Runtime: a browser reaches loop.urbnia.com through the host's shared Traefik. Traefik routes /api/* straight to the backend API container (Bun and Fastify on port 8088, router localloop-api) and everything else to the site container's nginx (router localloop-site), which serves the static Next.js export and answers /api/* with a JSON 503 only while the API is down. The API uses PostgreSQL with PostGIS, Valkey, and SeaweedFS. The former hostnames localloop.urbnia.com and loop-api.urbnia.com answer with 308 redirects at Traefik. Build time: protocol/ is canonical; its schemas are synced byte-identical into the backend and its artifacts are mirrored into the site, and a conformance check fails on any drift.</desc>
