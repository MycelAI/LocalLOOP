# Machine-readable licensing for files that cannot carry an SPDX header
# (REUSE Specification 3.3, https://reuse.software/spec-3.3/).
#
# Comment-capable first-party source files carry their own
# SPDX-FileCopyrightText / SPDX-License-Identifier header; the root LICENSE
# file is the human-readable summary of this map.
#
# Order matters: when several [[annotations]] match a file, the LAST matching
# table wins. General defaults come first, more specific entries later.
#   precedence = "closest"  - a header in the file wins; this table only fills
#                             in what the file does not state (first-party).
#   precedence = "override" - this table is authoritative even if the file
#                             contains other copyright-like text (third-party
#                             material, brand assets, internal records,
#                             generated mirror, notices that quote others).
version = 1

# ---------------------------------------------------------------------------
# 1. First-party defaults (MIT): documentation, data, config and lockfiles of
#    apps/backend, apps/site, ops/org-profile, scripts/, .github/ and the
#    repository root. Later entries narrow this down.
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.jsonld",
  "**/*.txt",
  "**/*.lock",
  "**/*.example",
  "**/.gitignore",
  "**/.dockerignore",
  ".github/**",
  "docs/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "MIT"

# Legal notices: they quote third-party copyright lines, so take the file's
# own terms from here only.
[[annotations]]
path = [
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "apps/backend/NOTICE",
  "apps/backend/THIRD_PARTY_NOTICES.md",
  "apps/site/public/licenses/NOTICE.txt",
  "apps/site/public/licenses/THIRD_PARTY_NOTICES.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# 2. protocol/ - code and machine-readable artefacts MIT, prose CC-BY-SA-4.0
#    (see protocol/LICENSE for the complete split).
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "protocol/*.md",
  "protocol/docs/**",
  "protocol/rfcs/**",
  "protocol/profiles/**.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# schemas/ and examples/ are code under the protocol split, including their
# README files.
[[annotations]]
path = ["protocol/schemas/**", "protocol/examples/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# 3. Generated mirror of protocol/ served by the site
#    (apps/site/public/projects/loop-protocol, written by
#    apps/site/scripts/aggregate-docs.sh). Same split as the canonical files.
# ---------------------------------------------------------------------------
[[annotations]]
path = "apps/site/public/projects/loop-protocol/**"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "apps/site/public/projects/loop-protocol/*.md",
  "apps/site/public/projects/loop-protocol/docs/**",
  "apps/site/public/projects/loop-protocol/rfcs/**",
  "apps/site/public/projects/loop-protocol/profiles/**.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "apps/site/public/projects/loop-protocol/schemas/**",
  "apps/site/public/projects/loop-protocol/examples/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# 4. Code of Conduct files: adapted from Contributor Covenant 3.0
#    (https://www.contributor-covenant.org/version/3/0/), stewarded by the
#    Organization for Ethical Source and licensed under CC BY-SA 4.0.
# ---------------------------------------------------------------------------
[[annotations]]
path = "**/CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Organization for Ethical Source (Contributor Covenant 3.0)",
  "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ---------------------------------------------------------------------------
# 5. Third-party material vendored into the site.
# ---------------------------------------------------------------------------
# Web fonts, fetched from Google Fonts on 2026-09-04 (latin + latin-ext
# subsets). Copyright lines from each family's OFL.txt in github.com/google/fonts.
[[annotations]]
path = "apps/site/public/assets/fonts/fraunces-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2018 The Fraunces Project Authors (https://github.com/undercasetype/Fraunces)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/site/public/assets/fonts/space-grotesk-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors (https://github.com/floriankarsten/space-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/site/public/assets/fonts/ibm-plex-mono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "© 2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# Phosphor Icons 2.1.2 (@phosphor-icons/web), woff2 + style.css copied from the
# npm package; the woff2 files are byte-identical to the 2.1.2 tarball.
[[annotations]]
path = "apps/site/public/assets/icons/phosphor/**"
precedence = "override"
SPDX-FileCopyrightText = "2020-2021 Phosphor Icons"
SPDX-License-Identifier = "MIT"

# Hero basemap baked from OpenStreetMap raster tiles (see THIRD_PARTY_NOTICES.md).
[[annotations]]
path = "apps/site/public/assets/loop-basemap.webp"
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

# ---------------------------------------------------------------------------
# 6. Brand assets: all rights reserved (LICENSES/LicenseRef-Mycel-Brand.txt).
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "apps/site/public/assets/local-loop-logo.png",
  "apps/site/public/favicon.ico",
  "apps/site/public/favicon.svg",
  "apps/site/public/assets/images/localloop-0*-16x9.webp",
  "docs/assets/brand/**",
  "docs/assets/screenshots/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "LicenseRef-Mycel-Brand"

# The home screenshot shows the OpenStreetMap-derived hero basemap.
[[annotations]]
path = "docs/assets/screenshots/home.webp"
precedence = "override"
SPDX-FileCopyrightText = [
  "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)",
  "OpenStreetMap contributors",
]
SPDX-License-Identifier = "LicenseRef-Mycel-Brand AND ODbL-1.0"

# ---------------------------------------------------------------------------
# 7. Internal records: no rights granted
#    (LICENSES/LicenseRef-Mycel-Proprietary.txt).
# ---------------------------------------------------------------------------
[[annotations]]
path = "ops/ledger/**"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Alphin Tom / Mycel UG (haftungsbeschränkt)"
SPDX-License-Identifier = "LicenseRef-Mycel-Proprietary"
