# Security headers shared by every location block. nginx does not inherit
# add_header from the parent when a location sets its own add_header, so this
# file is `include`d wherever headers are added (see nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "0" always;
# Traefik terminates TLS in front of this container and does not set HSTS itself.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Static export: fonts, icons and images are self-hosted; the only cross-origin
# traffic is the lab API. Next.js's static export bootstraps each page with a
# few inline <script> elements, so $csp_script_hashes (an nginx map generated at
# build time by scripts/generate-csp-hashes.mjs, keyed by the served HTML file)
# allows exactly those scripts by hash instead of 'unsafe-inline'. Styles keep
# 'unsafe-inline': React style props and Mermaid's rendered SVG use inline style
# attributes, which cannot be hash-listed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://loop-api.urbnia.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
