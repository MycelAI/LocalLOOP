# Security headers shared by every location block. nginx does not inherit
# add_header from the parent when a location sets its own add_header, so this
# file is `include`d wherever headers are added (see nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "0" always;
# Traefik terminates TLS in front of this container and does not set HSTS itself.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Static export: fonts, icons and images are self-hosted; the only cross-origin
# traffic is the lab API. 'unsafe-inline' for scripts is required by Next.js's
# static-export hydration payload (inline <script> bootstraps), and for styles by
# the inline style attributes Mermaid/SVG output carries.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://loop-api.urbnia.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
