# Proxy settings shared by the /api/ locations in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Traefik already set these from the real client; pass them through unchanged
# (appending this hop would make the API, which trusts exactly one proxy hop,
# key its rate limits on Traefik's address instead of the client's).
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
# SSE streams (/api/interest/stream, /api/v1/stream) must not be buffered and
# outlive the default 60 s read timeout; the API sends keepalives every 25 s.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
client_max_body_size 1m;
