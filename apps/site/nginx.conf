server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the static docs hub (lab surface); `always`
    # ensures error responses carry the same posture. Included per static
    # location (not at server level) so the proxied /api/ locations below pass
    # the backend's own headers through instead of the site's CSP.

    # Next.js static export renders 404.html; without this nginx served its own
    # bare 404 page instead.
    error_page 404 /404.html;

    # Directory redirects (/protocol/spec -> /protocol/spec/) as relative
    # Locations: nginx sits behind Traefik on plain HTTP, so an absolute redirect
    # would name http:// and drop any published port, forcing an extra hop.
    absolute_redirect off;

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # Same-origin lab API: the shared Traefik routes https://loop.urbnia.com/api/*
    # straight to the backend container (router `localloop-api` in
    # apps/backend/docker-compose.yml). Requests only reach this location when
    # that router is absent -- the API container is stopped, restarting or not
    # yet healthy -- so answer with a JSON 503 instead of the site's HTML 404.
    location ^~ /api/ {
        default_type application/json;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The lab API is unavailable or restarting; retry shortly."}}';
    }

    # Content-hashed build assets: cache for a year.
    location ^~ /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts, icon fonts, images, CSS and scripts: not content-hashed,
    # so a week with revalidation.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # RFC 8615 change-password well-known URL must redirect to the relevant page.
    location = /.well-known/change-password {
        include /etc/nginx/security-headers.conf;
        return 302 /docs/security/;
    }

    # Serve mirrored markdown source files (public/projects/...) as readable
    # text instead of nginx's default application/octet-stream, which makes
    # browsers force-download the file instead of displaying it.
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
        include /etc/nginx/security-headers.conf;
    }

    # Core-DP profile schema $ids carry the profile version
    # (.../profiles/core-dp/0.1.0-lab/schemas/<name>) while the mirror stores
    # the files under .../profiles/core-dp/schemas/; serve the $id URLs too.
    location ^~ /projects/loop-protocol/profiles/core-dp/0.1.0-lab/schemas/ {
        rewrite ^/projects/loop-protocol/profiles/core-dp/0\.1\.0-lab/schemas/(.*)$ /projects/loop-protocol/profiles/core-dp/schemas/$1 last;
    }

    # JSON-LD contexts (projects/loop-protocol/contexts/*.jsonld) are protocol
    # identifiers dereferenced by JSON-LD processors: serve the registered media
    # type instead of application/octet-stream (nginx's mime.types has no entry
    # for .jsonld), and allow cross-origin reads so browser-based processors on
    # other origins can load them.
    location ~* \.jsonld$ {
        default_type application/ld+json;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/ld+json image/svg+xml font/woff2;
    gzip_min_length 1000;
}
