server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the static docs hub (lab surface).
    # `always` ensures error responses carry the same posture.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve mirrored markdown source files (public/projects/...) as readable
    # text instead of nginx's default application/octet-stream, which makes
    # browsers force-download the file instead of displaying it.
    # Note: nginx does not inherit parent add_header into locations that set
    # their own add_header, so restate security headers here.
    location ~* \.md$ {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "0" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
